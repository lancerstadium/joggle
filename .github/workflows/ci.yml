name: ci

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        id: test
        run: >-
          ctest --test-dir build --output-on-failure
          --output-junit ctest.xml
      - name: Preserve CTest failure
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        run: |
          while IFS= read -r failed_test; do
            test_name="${failed_test#*:}"
            echo "::error title=CTest failed::$test_name"
          done < build/Testing/Temporary/LastTestsFailed.log
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          def escape(value):
              return (value.replace("%", "%25")
                           .replace("\r", "%0D")
                           .replace("\n", "%0A"))

          for case in ET.parse("build/ctest.xml").iterfind(".//testcase"):
              failure = case.find("failure")
              if failure is not None:
                  name = escape(case.get("name", "unnamed test"))
                  output = case.find("system-out")
                  detail = (failure.text or "") + (output.text or "" if output is not None else "")
                  detail = escape((detail or "no failure output")[-12000:])
                  print(f"::error title=CTest {name}::{detail}")
          PY
          {
            echo '### CTest failure'
            echo '```text'
            cat build/Testing/Temporary/LastTest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  optional-modules:
    name: Linux optional modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install codec dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            flatbuffers-compiler libflatbuffers-dev \
            libprotobuf-dev protobuf-compiler
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DJOGGLE_BUILD_ONNX=ON
          -DJOGGLE_BUILD_TFLITE=ON
          -DJOGGLE_BUILD_SAT=ON
      - name: Build
        id: optional-build
        run: |
          set -o pipefail
          cmake --build build --parallel 2 2>&1 | tee optional-build.log
      - name: Preserve optional build failure
        if: ${{ failure() && steps.optional-build.outcome == 'failure' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path("optional-build.log").read_text(errors="replace")[-12000:]
          text = (text.replace("%", "%25")
                      .replace("\r", "%0D")
                      .replace("\n", "%0A"))
          print(f"::error title=Optional module build failed::{text}")
          PY
      - name: Test
        id: optional-test
        run: >-
          ctest --test-dir build --output-on-failure
          --output-junit ctest.xml
      - name: Preserve optional test failure
        if: ${{ failure() && steps.optional-test.outcome == 'failure' }}
        run: |
          while IFS= read -r failed_test; do
            test_name="${failed_test#*:}"
            echo "::error title=CTest failed::$test_name"
          done < build/Testing/Temporary/LastTestsFailed.log
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          def escape(value):
              return (value.replace("%", "%25")
                           .replace("\r", "%0D")
                           .replace("\n", "%0A"))

          for case in ET.parse("build/ctest.xml").iterfind(".//testcase"):
              failure = case.find("failure")
              if failure is not None:
                  name = escape(case.get("name", "unnamed test"))
                  output = case.find("system-out")
                  detail = ((failure.text or "") +
                            (output.text or "" if output is not None else ""))
                  detail = escape((detail or "no failure output")[-12000:])
                  print(f"::error title=CTest {name}::{detail}")
          PY

  sanitize:
    name: Linux sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
          -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        id: test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >-
          ctest --test-dir build --output-on-failure
          --output-junit ctest.xml
      - name: Preserve CTest failure
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        run: |
          while IFS= read -r failed_test; do
            test_name="${failed_test#*:}"
            echo "::error title=CTest failed::$test_name"
          done < build/Testing/Temporary/LastTestsFailed.log
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          def escape(value):
              return (value.replace("%", "%25")
                           .replace("\r", "%0D")
                           .replace("\n", "%0A"))

          for case in ET.parse("build/ctest.xml").iterfind(".//testcase"):
              failure = case.find("failure")
              if failure is not None:
                  name = escape(case.get("name", "unnamed test"))
                  output = case.find("system-out")
                  detail = (failure.text or "") + (output.text or "" if output is not None else "")
                  detail = escape((detail or "no failure output")[-12000:])
                  print(f"::error title=CTest {name}::{detail}")
          PY
          {
            echo '### CTest failure'
            echo '```text'
            cat build/Testing/Temporary/LastTest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
