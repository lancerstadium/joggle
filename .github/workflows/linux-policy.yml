name: linux-policy

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/linux-policy.yml
      - examples/onnx/app.cpp
      - examples/locality/**
      - modules/**
      - paper/measure_reorder.py
      - paper/measure_systems.py
      - paper/experiments/mobilenetv2-policy.json

permissions:
  contents: read

concurrency:
  group: linux-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Generic loop policy and ONNX Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: paper/experiments/requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libprotobuf-dev protobuf-compiler
          python3 -m pip install \
            --disable-pip-version-check \
            --requirement paper/experiments/requirements.txt

      - name: Fetch pinned MobileNetV2 application
        run: >-
          cmake -DOUT=.cache/onnx-zoo -DMODELS=mobilenetv2-7 -DAPP=ON
          -P test/zoo.cmake

      - name: Configure and build
        run: |
          cmake -S . -B build-app \
            -DCMAKE_BUILD_TYPE=Release \
            -DJOGGLE_BUILD_ONNX=ON \
            -DJOGGLE_EXAMPLE_MOBILENET=.cache/onnx-zoo/app/mobilenetv2-7
          cmake --build build-app --parallel 2

      - name: Produce canonical IR
        run: >-
          ctest --test-dir build-app -R '^onnx-app-mobilenet$'
          --output-on-failure

      - name: Apply source loop policy
        id: transform
        run: |
          set -o pipefail
          mkdir -p build-policy
          python3 paper/measure_reorder.py \
            --tool build-app/joggle \
            --modules build-app/modules \
            --examples examples \
            --model MobileNetV2=build-app/examples/mobilenet/canonical.jog \
            --out-dir build-policy \
            --output build-policy/variants.csv \
            2>&1 | tee build-policy/transform.log

      - name: Preserve transform failure
        if: ${{ failure() && steps.transform.outcome == 'failure' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path("build-policy/transform.log").read_text(
              errors="replace"
          )[-12000:]
          text = (text.replace("%", "%25")
                      .replace("\r", "%0D")
                      .replace("\n", "%0A"))
          print(f"::error title=Loop policy failed::{text}")
          PY

      - name: Package and validate generated C
        run: |
          root=build-policy/MobileNetV2/canon
          build-app/joggle emit c.header "$root/placed.jog" \
            --arg '"weights"' -M build-app/modules > "$root/model.h"
          build-app/joggle emit c.data "$root/placed.jog" \
            -M build-app/modules > "$root/model.bin"
          build-app/joggle query c.api "$root/placed.jog" \
            --arg '"weights"' -M build-app/modules > "$root/api.json"
          python3 examples/onnx/make_harness.py \
            "$root/api.json" "$root/harness.c" --header model.h
          cc -std=c11 -O3 -Wall -Wextra -Wstrict-prototypes -Werror \
            -I "$root" "$root/model.c" "$root/harness.c" -lm \
            -o "$root/model"
          "$root/model" \
            build-app/examples/mobilenet/input.bin \
            "$root/model.bin" \
            build-app/examples/mobilenet/expected.bin 0 1

      - name: Record same-run policy ablation
        id: measure
        run: |
          set -o pipefail
          mkdir -p build-policy/results
          cpu="$(python3 - <<'PY'
          import os
          print(min(os.sched_getaffinity(0)))
          PY
          )"
          python3 paper/measure_systems.py \
            --manifest paper/experiments/mobilenetv2.json \
            --repo . \
            --output build-policy/results/mobilenetv2-plain.csv \
            --record build-policy/results/mobilenetv2-plain.json \
            --cpu "$cpu" --require-clean \
            2>&1 | tee build-policy/results/mobilenetv2-plain.log
          python3 paper/measure_systems.py \
            --manifest paper/experiments/mobilenetv2-policy.json \
            --repo . \
            --output build-policy/results/mobilenetv2-policy.csv \
            --record build-policy/results/mobilenetv2-policy.json \
            --cpu "$cpu" --require-clean \
            2>&1 | tee build-policy/results/mobilenetv2-policy.log

      - name: Preserve measurement failure
        if: ${{ failure() && steps.measure.outcome == 'failure' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path(
              "build-policy/results/mobilenetv2-policy.log"
          ).read_text(errors="replace")[-12000:]
          text = (text.replace("%", "%25")
                      .replace("\r", "%0D")
                      .replace("\n", "%0A"))
          print(f"::error title=Policy measurement failed::{text}")
          PY

      - name: Summarize median
        run: |
          python3 - <<'PY'
          import csv
          import os
          import statistics
          from pathlib import Path

          def medians(name):
              path = Path(f"build-policy/results/mobilenetv2-{name}.csv")
              rows = list(csv.DictReader(path.open()))
              return {
                  system: statistics.median(
                      float(row["seconds"]) for row in rows
                      if row["system"] == system
                  )
                  for system in ("joggle", "onnxruntime")
              }

          plain = medians("plain")
          policy = medians("policy")
          summary = (
              "## Same-run generic loop-policy diagnostic\n\n"
              "One pinned CPU on one GitHub runner; diagnostic rather than "
              "publication data.\n\n"
              "| Plain | Policy | ORT beside plain | ORT beside policy | "
              "Policy / Plain |\n"
              "|---:|---:|---:|---:|---:|\n"
              f"| {plain['joggle'] * 1000:.3f} ms | "
              f"{policy['joggle'] * 1000:.3f} ms | "
              f"{plain['onnxruntime'] * 1000:.3f} ms | "
              f"{policy['onnxruntime'] * 1000:.3f} ms | "
              f"{policy['joggle'] / plain['joggle']:.2f}x |\n"
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as stream:
              stream.write(summary)
          print(
              "::notice title=Same-run loop-policy diagnostic::"
              f"plain {plain['joggle'] * 1000:.3f} ms, "
              f"policy {policy['joggle'] * 1000:.3f} ms, "
              f"ORT/plain-run {plain['onnxruntime'] * 1000:.3f} ms, "
              f"ORT/policy-run {policy['onnxruntime'] * 1000:.3f} ms, "
              f"policy/plain {policy['joggle'] / plain['joggle']:.2f}x"
          )
          PY

      - name: Upload raw records
        uses: actions/upload-artifact@v6
        with:
          name: linux-policy-${{ github.sha }}
          path: |
            build-policy/variants.csv
            build-policy/results/
          if-no-files-found: error
          retention-days: 30
