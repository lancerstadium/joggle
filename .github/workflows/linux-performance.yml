name: linux-performance

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/linux-performance.yml
      - examples/onnx/app.cpp
      - modules/c/module.jog
      - test/models.cmake
      - test/zoo.cmake

permissions:
  contents: read

concurrency:
  group: linux-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Joggle and ONNX Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: paper/experiments/requirements.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libprotobuf-dev protobuf-compiler
          python3 -m pip install \
            --disable-pip-version-check \
            --requirement paper/experiments/requirements.txt

      - name: Fetch pinned ONNX applications
        id: fetch
        run: |
          set -o pipefail
          mkdir -p build-app
          for model in mnist-8 mobilenetv2-7; do
            fetched=false
            for attempt in 1 2 3; do
              if cmake -DOUT=.cache/onnx-zoo -DMODELS="$model" -DAPP=ON \
                  -P test/zoo.cmake 2>&1 | tee -a build-app/model-fetch.log; then
                fetched=true
                break
              fi
              sleep "$((attempt * 5))"
            done
            if [ "$fetched" != true ]; then
              exit 1
            fi
          done

      - name: Preserve model-fetch failure
        if: ${{ failure() && steps.fetch.outcome == 'failure' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path("build-app/model-fetch.log").read_text(
              errors="replace"
          )[-12000:]
          text = (text.replace("%", "%25")
                      .replace("\r", "%0D")
                      .replace("\n", "%0A"))
          print(f"::error title=Pinned model fetch failed::{text}")
          PY

      - name: Configure Release applications
        run: >-
          cmake -S . -B build-app
          -DCMAKE_BUILD_TYPE=Release
          -DJOGGLE_BUILD_ONNX=ON
          -DJOGGLE_EXAMPLE_MNIST=.cache/onnx-zoo/app/mnist-8
          -DJOGGLE_EXAMPLE_MOBILENET=.cache/onnx-zoo/app/mobilenetv2-7

      - name: Build
        run: cmake --build build-app --parallel 2

      - name: Generate and validate application artifacts
        id: validate
        run: |
          set -o pipefail
          ctest --test-dir build-app \
            -R '^onnx-app-(mnist|mobilenet)$' \
            --output-on-failure 2>&1 | tee build-app/application-test.log

      - name: Preserve application failure
        if: ${{ failure() && steps.validate.outcome == 'failure' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path("build-app/application-test.log").read_text(
              errors="replace"
          )[-12000:]
          text = (text.replace("%", "%25")
                      .replace("\r", "%0D")
                      .replace("\n", "%0A"))
          print(f"::error title=ONNX application validation failed::{text}")
          PY

      - name: Record independent-system timings
        id: measure
        run: |
          set -o pipefail
          mkdir -p build-app/performance
          cpu="$(python3 - <<'PY'
          import os
          print(min(os.sched_getaffinity(0)))
          PY
          )"
          python3 paper/measure_systems.py \
            --manifest paper/experiments/mnist.json \
            --repo . \
            --output build-app/performance/mnist.csv \
            --record build-app/performance/mnist.json \
            --cpu "$cpu" --require-clean \
            2>&1 | tee build-app/performance/mnist.log
          python3 paper/measure_systems.py \
            --manifest paper/experiments/mobilenetv2.json \
            --repo . \
            --output build-app/performance/mobilenetv2.csv \
            --record build-app/performance/mobilenetv2.json \
            --cpu "$cpu" --require-clean \
            2>&1 | tee build-app/performance/mobilenetv2.log

      - name: Preserve measurement failure
        if: ${{ failure() && steps.measure.outcome == 'failure' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          logs = Path("build-app/performance").glob("*.log")
          text = "\n".join(path.read_text(errors="replace") for path in logs)
          text = (text[-12000:].replace("%", "%25")
                                .replace("\r", "%0D")
                                .replace("\n", "%0A"))
          print(f"::error title=System measurement failed::{text}")
          PY

      - name: Summarize medians
        run: |
          python3 - <<'PY'
          import csv
          import os
          import statistics
          from pathlib import Path

          summary = [
              "## Directional Linux performance",
              "",
              "Shared GitHub runner; medians are diagnostic, not publication claims.",
              "",
              "| Model | Joggle | ONNX Runtime | Joggle / ORT |",
              "|---|---:|---:|---:|",
          ]
          notice = []
          for model in ("mnist", "mobilenetv2"):
              rows = list(csv.DictReader(
                  Path(f"build-app/performance/{model}.csv").open()
              ))
              samples = {
                  system: [float(row["seconds"]) for row in rows
                           if row["system"] == system]
                  for system in ("joggle", "onnxruntime")
              }
              joggle = statistics.median(samples["joggle"])
              runtime = statistics.median(samples["onnxruntime"])
              summary.append(
                  f"| {model} | {joggle * 1000:.3f} ms | "
                  f"{runtime * 1000:.3f} ms | {joggle / runtime:.2f}x |"
              )
              notice.append(
                  f"{model}: Joggle {joggle * 1000:.3f} ms, "
                  f"ORT {runtime * 1000:.3f} ms, {joggle / runtime:.2f}x"
              )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as stream:
              stream.write("\n".join(summary) + "\n")
          print("::notice title=Directional Linux performance::" +
                " | ".join(notice))
          PY

      - name: Upload raw records
        uses: actions/upload-artifact@v6
        with:
          name: linux-performance-${{ github.sha }}
          path: build-app/performance/
          if-no-files-found: error
          retention-days: 30
