name: linux-fusion

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/linux-fusion.yml
      - test/onnx-app/**
      - modules/**
      - paper/scripts/measure_fusion.py
      - paper/scripts/measure_systems.py
      - paper/experiments/mobilenetv2-fusion.json
      - paper/experiments/mobilenetv2-unfused.json

permissions:
  contents: read

concurrency:
  group: linux-fusion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fusion:
    name: Generic fusion and ONNX Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: paper/experiments/requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libprotobuf-dev protobuf-compiler
          python3 -m pip install \
            --disable-pip-version-check \
            --requirement paper/experiments/requirements.txt

      - name: Fetch pinned MobileNetV2 application
        run: >-
          cmake -DOUT=.cache/onnx-zoo -DMODELS=mobilenetv2-7 -DAPP=ON
          -P test/zoo.cmake

      - name: Build application compiler
        run: |
          cmake -S . -B build-app \
            -DCMAKE_BUILD_TYPE=Release \
            -DJOGGLE_BUILD_ONNX=ON \
            -DJOGGLE_EXAMPLE_MOBILENET=.cache/onnx-zoo/app/mobilenetv2-7
          cmake --build build-app --parallel 2
          ctest --test-dir build-app -R '^onnx-app-mobilenet$' \
            --output-on-failure

      - name: Build matched fusion variants
        run: |
          python3 paper/scripts/measure_fusion.py \
            --tool build-app/joggle \
            --modules build-app/modules \
            --model build-app/examples/mobilenet/canonical.jog \
            --out-dir build-fusion \
            --output build-fusion/variants.csv

      - name: Package and validate generated C
        run: |
          for variant in baseline fused; do
            root="build-fusion/$variant"
            build-app/joggle emit c.header "$root/placed.jog" \
              --arg '"weights"' -M build-app/modules > "$root/model.h"
            build-app/joggle emit c.data "$root/placed.jog" \
              -M build-app/modules > "$root/model.bin"
            build-app/joggle query c.api "$root/placed.jog" \
              --arg '"weights"' -M build-app/modules > "$root/api.json"
            python3 test/tools/make_harness.py \
              "$root/api.json" "$root/harness.c" --header model.h
            cc -std=c11 -O3 -DNDEBUG -Wall -Wextra \
              -Wstrict-prototypes -Werror -I "$root" \
              "$root/model.c" "$root/harness.c" -lm -o "$root/model"
            "$root/model" \
              build-app/examples/mobilenet/input.bin \
              "$root/model.bin" \
              build-app/examples/mobilenet/expected.bin 0 1
          done

      - name: Record balanced fusion ablation
        run: |
          mkdir -p build-fusion/results
          cpu="$(python3 - <<'PY'
          import os
          print(min(os.sched_getaffinity(0)))
          PY
          )"
          python3 paper/scripts/measure_systems.py \
            --manifest paper/experiments/mobilenetv2-unfused.json \
            --repo . \
            --output build-fusion/results/mobilenetv2-unfused.csv \
            --record build-fusion/results/mobilenetv2-unfused.json \
            --cpu "$cpu" --require-clean
          python3 paper/scripts/measure_systems.py \
            --manifest paper/experiments/mobilenetv2-fusion.json \
            --repo . \
            --output build-fusion/results/mobilenetv2-fusion.csv \
            --record build-fusion/results/mobilenetv2-fusion.json \
            --cpu "$cpu" --require-clean

      - name: Summarize evidence
        run: |
          python3 - <<'PY'
          import csv
          import os
          import statistics
          from pathlib import Path

          def medians(name):
              rows = list(csv.DictReader(Path(
                  f"build-fusion/results/mobilenetv2-{name}.csv"
              ).open()))
              return {
                  system: statistics.median(
                      float(row["seconds"]) for row in rows
                      if row["system"] == system
                  )
                  for system in ("joggle", "onnxruntime")
              }

          unfused = medians("unfused")
          fused = medians("fusion")
          variants = {
              row["variant"]: row
              for row in csv.DictReader(Path(
                  "build-fusion/variants.csv"
              ).open())
          }
          base = variants["baseline"]
          fused_variant = variants["fused"]
          summary = (
              "## Same-run fusion ablation\n\n"
              "One pinned CPU on one GitHub runner; diagnostic rather than "
              "publication data.\n\n"
              "| Unfused | Fused | ONNX Runtime | Fused / Unfused | "
              "Loops | C bytes |\n"
              "|---:|---:|---:|---:|---:|---:|\n"
              f"| {unfused['joggle'] * 1000:.3f} ms | "
              f"{fused['joggle'] * 1000:.3f} ms | "
              f"{fused['onnxruntime'] * 1000:.3f} ms | "
              f"{fused['joggle'] / unfused['joggle']:.2f}x | "
              f"{base['loops']} -> {fused_variant['loops']} | "
              f"{base['c_bytes']} -> {fused_variant['c_bytes']} |\n"
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as stream:
              stream.write(summary)
          print(summary)
          PY

      - name: Upload raw records
        uses: actions/upload-artifact@v6
        with:
          name: linux-fusion-${{ github.sha }}
          path: |
            build-fusion/variants.csv
            build-fusion/results/
          if-no-files-found: error
          retention-days: 30
