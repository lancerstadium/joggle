name: linux-tflite

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/linux-tflite.yml
      - test/tools/make_harness.py
      - modules/**
      - paper/scripts/bench_litert.py
      - paper/scripts/make_tflite_fixture.py
      - paper/scripts/prepare_tflite.py
      - paper/scripts/measure_systems.py
      - paper/experiments/requirements-litert.txt
      - paper/experiments/tflite-mobilenetv2.json

permissions:
  contents: read

concurrency:
  group: linux-tflite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: TFLite to C and LiteRT
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: paper/experiments/requirements-litert.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            flatbuffers-compiler libflatbuffers-dev
          python3 -m pip install \
            --disable-pip-version-check \
            --requirement paper/experiments/requirements-litert.txt

      - name: Fetch pinned TFLite MobileNetV2
        run: >-
          cmake -DOUT=.cache/models/mobilenet_v2.tflite
          -P test/tflite.cmake

      - name: Build and test TFLite frontend
        run: |
          cmake -S . -B build-tflite \
            -DCMAKE_BUILD_TYPE=Release \
            -DJOGGLE_BUILD_TFLITE=ON \
            -DJOGGLE_TEST_TFLITE_MODEL="$PWD/.cache/models/mobilenet_v2.tflite"
          cmake --build build-tflite --parallel 2
          ctest --test-dir build-tflite \
            -R '^(tflite|tflite-value)$' --output-on-failure

      - name: Compile the TFLite model to C
        run: |
          python3 paper/scripts/prepare_tflite.py \
            --tool build-tflite/joggle \
            --modules build-tflite/modules \
            --model .cache/models/mobilenet_v2.tflite \
            --out-dir build-tflite-study
          python3 paper/scripts/make_tflite_fixture.py \
            .cache/models/mobilenet_v2.tflite \
            build-tflite-study/input.bin \
            build-tflite-study/expected.bin \
            build-tflite-study/fixture.json
          python3 test/tools/make_harness.py \
            build-tflite-study/api.json \
            build-tflite-study/harness.c --header model.h
          cc -std=c11 -O3 -DNDEBUG -Wall -Wextra \
            -Wstrict-prototypes -Werror \
            -I build-tflite-study \
            build-tflite-study/model.c \
            build-tflite-study/harness.c -lm \
            -o build-tflite-study/model
          build-tflite-study/model \
            build-tflite-study/input.bin \
            build-tflite-study/model.bin \
            build-tflite-study/expected.bin 0 1

      - name: Record balanced LiteRT comparison
        run: |
          mkdir -p build-tflite-study/results
          cpu="$(python3 - <<'PY'
          import os
          print(min(os.sched_getaffinity(0)))
          PY
          )"
          python3 paper/scripts/measure_systems.py \
            --manifest paper/experiments/tflite-mobilenetv2.json \
            --repo . \
            --output build-tflite-study/results/tflite-mobilenetv2.csv \
            --record build-tflite-study/results/tflite-mobilenetv2.json \
            --cpu "$cpu" --require-clean

      - name: Summarize evidence
        run: |
          python3 - <<'PY'
          import csv
          import json
          import os
          import statistics
          from pathlib import Path

          root = Path("build-tflite-study")
          rows = list(csv.DictReader(
              (root / "results/tflite-mobilenetv2.csv").open()
          ))
          medians = {
              system: statistics.median(
                  float(row["seconds"]) for row in rows
                  if row["system"] == system
              )
              for system in ("joggle", "litert")
          }
          compile_record = json.loads((root / "compile.json").read_text())
          stats = compile_record["stats"]
          summary = (
              "## TFLite application diagnostic\n\n"
              "One pinned CPU on one GitHub runner; diagnostic rather than "
              "publication data.\n\n"
              "| Joggle C | LiteRT | Joggle / LiteRT | Loops | Workspace |\n"
              "|---:|---:|---:|---:|---:|\n"
              f"| {medians['joggle'] * 1000:.3f} ms | "
              f"{medians['litert'] * 1000:.3f} ms | "
              f"{medians['joggle'] / medians['litert']:.2f}x | "
              f"{stats['loops']} | {stats['mem_elems']} f32 |\n"
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as stream:
              stream.write(summary)
          print(summary)
          PY

      - name: Upload raw records
        uses: actions/upload-artifact@v6
        with:
          name: linux-tflite-${{ github.sha }}
          path: |
            build-tflite-study/compile.json
            build-tflite-study/fixture.json
            build-tflite-study/results/
          if-no-files-found: error
          retention-days: 30
