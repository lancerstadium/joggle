<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f5">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.url == "/" %}Joggle{% else %}{{ page.title | default: "Joggle" | escape }}{% endif %}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body class="{% if page.home %}home{% else %}docs{% endif %}">
    <header class="topbar">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Joggle home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Joggle</span>
      </a>
      <nav class="topnav" aria-label="Global navigation">
        <a href="{{ '/getting-started/' | relative_url }}">Docs</a>
        <a href="https://github.com/{{ site.repository }}">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
    </header>

    {% if page.home %}
      <main class="home-shell">{{ content }}</main>
    {% else %}
      <div class="docs-shell">
        <aside class="sidebar" aria-label="Documentation navigation">
          {% for group in site.data.navigation %}
            <section class="nav-group">
              <div class="nav-label">{{ group.label }}</div>
              {% for item in group.items %}
                {% assign item_url = item.url | relative_url %}
                <a href="{{ item_url }}"{% if page.url == item.url %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
              {% endfor %}
            </section>
          {% endfor %}
        </aside>

        <main class="content"><article>{{ content }}</article></main>

        <aside class="toc-shell" aria-label="On this page">
          <div class="toc-title">On this page</div>
          <nav id="toc"></nav>
        </aside>
      </div>
    {% endif %}

    <script src="{{ '/assets/js/docs.js' | relative_url }}" defer></script>
  </body>
</html>
