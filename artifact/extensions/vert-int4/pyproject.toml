[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compiler-study-lowbit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["xdsl==0.71.0"]

[project.entry-points."xdsl.universe"]
study_lowbit = "study_lowbit.plugin:UNIVERSE"

[tool.setuptools]
packages = ["study_lowbit"]
package-dir = {study_lowbit = "."}
include-package-data = false
